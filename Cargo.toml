[package]
name = "bevy_2dviewangle"
version = "0.14.0"
authors = ["Trung Do <dothanhtrung@pm.me>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/245project/bevy-plugin/bevy-2dviewangle"
keywords = ["bevy"]
description = "Bevy plugin for easier to switch texture base on view angles"
exclude = ["assets", "examples", ".cargo", "tests", "bevy-2dviewangle-macro"]
categories = ["game-development"]

[dependencies]
bevy = { version = ">=0.20", features = ["bevy_asset", "bevy_sprite", "bevy_state"], default-features = false }
bevy_2dviewangle_macro = { version = ">=0.6", path = "./bevy-2dviewangle-macro" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
bevy = { version = ">=0.20", features = ["dynamic_linking"] }
bevy_sprite3d = { git = "https://github.com/dothanhtrung/bevy_sprite3d.git", branch = "main" }
bevy_asset_loader = { version = ">=0.28.0-rc.1", features = ["2d"] }

[features]
default = []
serialize = ["serde", "bevy/serialize"]
